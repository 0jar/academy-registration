name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ACADEMY_BROWSER_TESTS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: academy-register --config academy_registration/preferences.example.txt --demo
